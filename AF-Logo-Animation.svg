<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Alexander Forum für Reflexion und Resilienz mit fünf Arbeitsfeldern">
<defs>
<style>
.bg{fill:#0c1115}.ink{fill:#e8edf2}.blue{stroke:#9cc3da;fill:none}.muted{fill:#b4c1cb}.tree,.wordmark,.label,.branch,.node{animation-iteration-count:infinite;animation-timing-function:ease-in-out}.tree{animation:tree 11.4s both infinite;transform-box:fill-box;transform-origin:center}.wordmark{animation:wordmark 11.4s both infinite}.label{opacity:0;animation:reveal 11.4s both infinite;font:500 22px Arial,Inter,sans-serif;letter-spacing:.7px}.l1{animation-delay:.38s}.l2{animation-delay:.76s}.l3{animation-delay:1.14s}.l4{animation-delay:1.52s}.l5{animation-delay:1.90s}.branch{stroke:#315567;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;pathLength:1;animation:draw 11.4s both infinite}.b1{animation-delay:.4s}.b2{animation-delay:.76s}.b3{animation-delay:1.12s}.b4{animation-delay:1.48s}.b5{animation-delay:1.84s}.node{fill:#0c1115;stroke:#9cc3da;stroke-width:2.5;opacity:0;animation:node 11.4s both infinite}.n1{animation-delay:.38s}.n2{animation-delay:.76s}.n3{animation-delay:1.14s}.n4{animation-delay:1.52s}.n5{animation-delay:1.90s}.leaf{fill:none;stroke:#315567;stroke-width:2;opacity:0;animation:leaf 11.4s both infinite}.q1{animation-delay:.3s}.q2{animation-delay:.9s}.q3{animation-delay:1.5s}
@keyframes tree{0%,7%{opacity:0;transform:translateY(20px) scale(.92)}18%,78%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateY(-12px) scale(1.03)}}
@keyframes wordmark{0%,12%{opacity:0;transform:translateX(14px)}28%,78%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateX(0)}}
@keyframes reveal{0%,42%{opacity:0;transform:translateY(8px)}55%,78%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes draw{0%,20%{stroke-dashoffset:1;opacity:.15}42%,78%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:1;opacity:.15}}
@keyframes node{0%,20%{opacity:0;r:2}43%,78%{opacity:1;r:5}94%,100%{opacity:0;r:2}}
@keyframes leaf{0%,25%{opacity:0;transform:scale(.55) rotate(-10deg)}45%,78%{opacity:.8;transform:none}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tree,.wordmark,.label,.branch,.node,.leaf{animation:none}.tree,.wordmark{opacity:1}.label{opacity:1}.branch{stroke-dashoffset:0;opacity:1}.node{opacity:1}.leaf{opacity:.7}}
</style>
</defs>
