<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Abstrakter Baum für Reflexion und Resilienz">
  <style>
    .trunk,.branch,.twig{fill:none;stroke:#315567;stroke-linecap:round;stroke-linejoin:round;pathLength:1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s cubic-bezier(.65,0,.35,1) infinite}
    .trunk{stroke-width:2}
    .branch{stroke-width:1.5}
    .twig{stroke-width:1.15}
    .flow{fill:none;stroke:#9cc3da;stroke-width:2;stroke-linecap:round;pathLength:1;stroke-dasharray:.035 .11;stroke-dashoffset:0;opacity:0;animation:flow 8s ease-in-out infinite}
    .node{fill:#0c1115;stroke:#9cc3da;stroke-width:1.4;r:4;opacity:0;animation:node 8s cubic-bezier(.65,0,.35,1) infinite}
    .n2{animation-delay:.16s}.n3{animation-delay:.30s}.n4{animation-delay:.44s}.n5{animation-delay:.58s}.n6{animation-delay:.72s}.n7{animation-delay:.86s}
    .leaf{fill:none;stroke:#315567;stroke-width:1.1;opacity:0;transform-box:fill-box;transform-origin:center;animation:leaf 8s ease-out infinite}
    .l2{animation-delay:.18s}.l3{animation-delay:.34s}.l4{animation-delay:.5s}.l5{animation-delay:.66s}.l6{animation-delay:.82s}

    @keyframes draw{
      0%,9%{stroke-dashoffset:1;opacity:.2}
      34%,62%{stroke-dashoffset:0;opacity:1}
      83%,100%{stroke-dashoffset:1;opacity:.2}
    }
    @keyframes flow{
      0%,31%{opacity:0;stroke-dashoffset:0}
      38%,61%{opacity:.78;stroke-dashoffset:-.32}
      70%,100%{opacity:0;stroke-dashoffset:-.32}
    }
    @keyframes node{
      0%,12%{opacity:0;r:2}
      34%,62%{opacity:1;r:4.3}
      82%,100%{opacity:0;r:2}
    }
    @keyframes leaf{
      0%,26%{opacity:0;transform:scale(.65) rotate(-8deg)}
      43%,63%{opacity:.7;transform:scale(1) rotate(0)}
      82%,100%{opacity:0;transform:scale(.82) rotate(4deg)}
    }
    @media (prefers-reduced-motion:reduce){
      .trunk,.branch,.twig,.flow,.node,.leaf{animation:none}
      .trunk,.branch,.twig{stroke-dashoffset:0;opacity:1}
      .flow{opacity:.45}
      .node{opacity:1}
      .leaf{opacity:.65;transform:none}
    }
  </style>

  <!-- main trunk -->
  <path class="trunk" d="M450 242 C449 212 451 180 450 150 C449 121 450 92 450 48"/>

  <!-- main branches: organic, upward-growing -->
  <path class="branch" d="M450 170 C414 153 376 132 332 112 C289 92 246 76 205 62"/>
  <path class="branch" d="M450 162 C488 145 527 124 571 104 C616 84 659 69 701 58"/>
  <path class="branch" d="M450 128 C421 111 395 91 372 68 C355 51 342 38 326 28"/>
  <path class="branch" d="M450 122 C479 103 504 83 528 61 C548 43 563 30 580 22"/>

  <!-- smaller twigs -->
  <path class="twig" d="M332 112 C315 101 302 90 290 76"/>
  <path class="twig" d="M205 62 C186 59 167 53 151 43"/>
  <path class="twig" d="M571 104 C589 94 606 83 620 69"/>
  <path class="twig" d="M701 58 C718 54 733 47 747 37"/>
  <path class="twig" d="M372 68 C361 58 353 47 348 34"/>
  <path class="twig" d="M528 61 C540 51 547 40 551 27"/>

  <!-- subtle motion along selected paths -->
  <path class="flow" d="M450 236 C449 203 451 174 450 145 C449 118 450 91 450 52"/>
  <path class="flow" d="M450 167 C413 151 375 130 332 111 C289 91 248 76 207 63" style="animation-delay:1.25s"/>
  <path class="flow" d="M450 159 C488 143 526 123 570 103 C614 84 657 69 699 58" style="animation-delay:2.2s"/>

  <!-- nodes -->
  <circle class="node" cx="450" cy="48"/>
  <circle class="node n2" cx="205" cy="62"/>
  <circle class="node n3" cx="701" cy="58"/>
  <circle class="node n4" cx="326" cy="28"/>
  <circle class="node n5" cx="580" cy="22"/>
  <circle class="node n6" cx="151" cy="43"/>
  <circle class="node n7" cx="747" cy="37"/>

  <!-- small tree-like leaves -->
  <path class="leaf" d="M440 39 C430 31 429 23 436 16 C443 24 446 32 440 39 Z"/>
  <path class="leaf l2" d="M460 48 C469 38 478 36 485 41 C478 49 468 52 460 48 Z"/>
  <path class="leaf l3" d="M184 59 C175 51 175 43 181 37 C188 45 190 53 184 59 Z"/>
  <path class="leaf l4" d="M719 56 C727 47 736 46 743 51 C736 59 726 61 719 56 Z"/>
  <path class="leaf l5" d="M339 30 C331 22 331 15 337 10 C344 17 346 25 339 30 Z"/>
  <path class="leaf l6" d="M592 25 C600 16 608 15 614 20 C607 28 599 30 592 25 Z"/>
</svg>